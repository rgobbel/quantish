title: Double slit, decoherence chain with an eraser on one recorder

caption: The three-recorder decoherence chain with a quantum eraser on the middle recorder — sorting the screen by that recorder's sign recovers its fringes only to the extent its record was complete.

notes: |-
  This variant of `double_slit_decoherence_chain.yaml` attaches the
  eraser machinery of `double_slit_eraser.yaml` to the middle recorder
  $r_2$: both of $g_{obs,2}$'s output wires feed a $45°$ gate $g_{erase}$,
  whose outputs end at the detectors $E1$ and $E2$. &nbsp;&nbsp;$r_1$ and $r_3$ are
  unchanged. The sweep sorts the screen by $r_2$'s final sign.

  In the plain eraser model the recorder enters its recorder gate with
  all of its weight and one sign, and sorting by its sign after the
  eraser shows two complementary fringe patterns of full visibility.
  Here $r_2$ reaches $g_{obs,2}$ with only the straight part of its $g_{pre,2}$
  split, and with both signs. Two things follow, with $s = \sin^2$ and
  $c = \cos^2$ of $\theta_{pre,2}$:

  - $r_2$'s bypass part (weight $s$, never at the eraser) carries the
    unshifted fringes of the both-open condition in both signs, weight
    $s^2$ at plus and $s*c$ at minus;
  - $r_2$'s recorded part (weight $c$) enters $g_{obs,2}$ with amplitudes ${\cos^2}$
    at plus and $i*\sin*\cos$ at minus, and the angle-$0$ recorder gate gives
    those two components opposite which-way polarity. After the eraser
    they land on the same final states and interfere: within a sign
    subset the recorded part keeps a fringe of visibility $\cos(2*\theta_{pre,2})$
    at plus and $-\cos(2*\theta_{pre,2})$ at minus, the eraser having split
    its weight evenly between the signs.

  Adding the two parts, the fringe visibility within each subset is
  
  $$
  \begin{align*}
  V+ &=& (2 s^2 + c \cos(2 \theta_{pre,2})) / (2 s^2 + c)\\
  V- &=& (2 s - \cos(2 \theta_{pre,2})) / (2 s + 1)
  \end{align*}
  $$

  with visibility measured as $(P(\varphi=0) - P(\varphi=180)) / (sum)$: a negative
  value means fringes shifted by half a period. $\theta_{pre,2} = 0$ $\rightarrow$
  $+1$ and $-1$, the eraser model. &nbsp;$30°$ $\rightarrow$ $4/7$ and zero, $45°$ $\rightarrow$
  $1/2$ and $1/2$, $60°$ $\rightarrow$ $8/11$ and $4/5$. The minus subset's fringes are
  shifted below $30°$ and unshifted above. With $r_1$ and $r_3$ active
  each subset's visibility is $V+- * \sin^2(\theta_{pre,1}) *
  \sin^2(\theta_{pre,3})$, while the other recorders factor out. The whole screen,
  unsorted, shows the chain's product law regardless.

  So: reading the recorder recovers its contribution to the fringes only
  when its record was complete. A partial recorder's sign carries its
  own $g_{pre}$ history as well as the which-way record, and no sort on
  that recorder alone separates the two; the interference its partial
  record suppressed is still in the total state, but reading $r_2$ does
  not bring it back. In the terms of the eraser model: only what was
  completely recorded can be erased.

  Per screen pixel the app overrides $\varphi$ with that pixel's phase.

# the screen sorted by the erased recorder's sign
sweep:
  title: screen intensity across one fringe period, sorted by r2's sign
  variable: phi
  from: 0
  to: 2*pi
  points: 41
  observe: {particle: p1, at: S}
  group_by: {particle: r2, coordinate: sign}

run_stages:
  split: [g_split]
  decoherence: [g_pre_1, g_pre_2, g_pre_3, bypass_1, bypass_2, bypass_3]
  observe_1: [g_obs_1]
  observe_2: [g_obs_2]
  observe_3: [g_obs_3]
  slits: [S1, S2]
  phase: [φ]
  merge: [g_merge]
  sort: [g_sort, g_erase]
  detect: [D, S, E1, E2]

particles:
  p1: {weight: 1, sign: 1}
  r1: {weight: 1, sign: 1}
  r2: {weight: 1, sign: 1}
  r3: {weight: 1, sign: 1}

gates:
  g_split: {angle: theta_split, angle_range: [0, 90]}
  g_pre_1: {angle: theta_pre_1, angle_range: [0, 90]}
  g_pre_2: {angle: theta_pre_2, angle_range: [0, 90]}
  g_pre_3: {angle: theta_pre_3, angle_range: [0, 90]}
  g_obs_1: {angle: 0}
  g_obs_2: {angle: 0}
  g_obs_3: {angle: 0}
  g_erase: {angle: theta_erase, angle_range: [0, 90]}
  g_merge: {angle: theta_merge, angle_range: [0, 90]}
  g_sort: {angle: theta_sort, angle_range: [0, 90]}

delay_gates: [D, S, S1, S2, E1, E2, bypass_1, bypass_2, bypass_3]

phase_plates:
  φ: 'phi'

display_strings:
  g_split: '$g_{split}$'
  g_pre_1: '$g_{pre,1}$'
  g_pre_2: '$g_{pre,2}$'
  g_pre_3: '$g_{pre,3}$'
  g_obs_1: '$g_{obs,1}$'
  g_obs_2: '$g_{obs,2}$'
  g_obs_3: '$g_{obs,3}$'
  g_erase: '$g_{erase}$'
  g_merge: '$g_{merge}$'
  g_sort: '$g_{sort}$'
  bypass_1: '$bypass_1$'
  bypass_2: '$bypass_2$'
  bypass_3: '$bypass_3$'

variables:
  theta_pre_1: '90°'
  theta_pre_2: '30°'
  theta_pre_3: '90°'
  theta_erase: '45°'
  theta_split: '45°'
  theta_merge: '45°'
  theta_sort: 0
  phi: 0

links:
  p1: g_split.upper
  r1: g_pre_1.upper
  r2: g_pre_2.upper
  r3: g_pre_3.upper
  g_pre_1.upper: g_obs_1.upper
  g_pre_2.upper: g_obs_2.upper
  g_pre_3.upper: g_obs_3.upper
  g_pre_1.lower: bypass_1
  g_pre_2.lower: bypass_2
  g_pre_3.lower: bypass_3
  g_obs_2.upper: g_erase.upper
  g_obs_2.lower: g_erase.lower
  g_erase.upper: E1
  g_erase.lower: E2
  g_split.upper: S1
  S1: g_merge.upper
  g_split.lower: g_obs_1.control
  g_obs_1.control: g_obs_2.control
  g_obs_2.control: g_obs_3.control
  g_obs_3.control: S2
  S2: φ
  φ: g_merge.lower
  g_merge.upper: g_sort.upper
  g_sort.upper: S
  g_sort.lower: D
