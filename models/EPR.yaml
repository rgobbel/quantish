title: Quantish EPR Experiment
symbolic: false

variables:
   zero: &zero "0+0j"
   one: &one "1+0j"
   minus_one: "-1+0j"
   q1: &q1 "rad(30)"
   q2: &q2 "acos(1/3)"
   q3: &q3 "rad(30)+pi/2"
   q4: &q4 "rad(20)"
   cw: &cw "0"
phases:
   prepare: [g1, g2]
   couple: [g3, g4]
   split: [g5, g6]
normalize_weights:
   output: true
   input: false
probability_threshold:
   control: 0.0
   forwarding: 0.0
particles:
   control1:
      sign: 1
      weight: *zero
   control2:
      sign: 1
      weight: *zero
   p1:
      sign: 1
      weight: *one
   p2:
      sign: 1
      weight: *one
   p3:
      sign: 1
      weight: *one
gates:
   g1:
      angle: *q1
   g2:
      angle: *q1
   g3:
      angle: 0
   g4:
      angle: 0
   g5:
      angle: *q2
   g6:
      angle: *q2
links:
   control1: g1.control
   p1: g1.upper
   p2: g2.upper
   p3: g3.upper
   g1.upper: g3.control
   g1.lower: g5.lower
   g2.upper: g4.control
   g2.lower: g6.lower
   g3.control: g5.upper
   g3.upper: g4.upper
   g3.lower: g4.lower
   g4.control: g6.upper
