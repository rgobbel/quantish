title: Opposites
symbolic: false
merge:
   before_measure: true
   before_forwarding: false
   combine_signs: true
   add_with_signs: true
normalize_weights:
   output: false
   input: false
probability_threshold:
   control: 0.0
   forwarding: 0
   presence: 0
winner_take_all: true
#string_precision: 2

variables:
   zero: &zero "0+0j"
   one: &one "1+0j"
   minus_one: &minus_one "-1+0j"
   eye: &eye "I"
   r60: &r60 "0.5+0.87j"
   pythag: &pythag "acos(4/5)"
   q30: &q30 "rad(30)"
phases:
   run: [g1, g2, g3]
particles:
   c:
      sign: 1
      weight: *zero
   p1:
      sign: 1
      weight: *one
   p2:
      sign: -1
      weight: *minus_one
gates:
   g1:
      angle: *pythag
   g2:
      angle: *pythag
   g3:
      angle: *q30
links:
   c: g1.control
   p1: g1.upper
   p2: g2.upper
   g1.upper: g3.control
   g2.upper: g3.lower
