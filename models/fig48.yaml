title: Figure 4.8
symbolic: false
merge:
   before_measure: false
   before_forwarding: false
   combine_signs: true
normalize_weights:
   output: false
   input: false
probability_threshold:
   control: 0
   forwarding: 0
   presence: 0
winner_take_all: true
string_precision: 2

variables:
   zero: &zero  "0j"
   one: &one  "1+0j"
   r60: &r60  "0.5+0.87j"
   q1: &q1 "rad(20)"
   q2: &q2 "rad(30)"
phases:
   run: [g1, g2]
particles:
   control:
      sign: 1
      weight: *zero
   p1:
      sign: 1
      weight: *one
gates:
   g1:
      angle: *q1
   g2:
      angle: *q2
links:
   control: g1.control
   p1: g1.upper
   g1.control: g2.control
   g1.upper: g2.upper