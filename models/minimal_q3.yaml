title: Minimal
symbolic: false
normalize_weights:
   output: true
   input: false
probability_threshold:
   control: 0.0
   forwarding: 0.0
variables:
   zero: &zero !!python/complex 0j
   one: &one !!python/complex (1+0j)
   q1: &q1 !RandomAngle
   q2: &q2 !RandomAngle
   q3: &q3
      base: *q1
      rotation: -90
   q4: &q4
      base: *q1
      rotation: 490
phases:
   run: [g1, g2, g3, g4]
particles:
   control1:
      sign: 1
      weight: *one
   control2:
      sign: 1
      weight: *one
   control3:
      sign: 1
      weight: *zero
   control4:
      sign: 1
      weight: *zero
   p1:
      sign: 1
      weight: *one
   p2:
      sign: 1
      weight: *one
   p3:
      sign: 1
      weight: *one
   p4:
      sign: 1
      weight: *one
gates:
   g1:
      angle: 10
   g2:
      angle: 100
   g3:
      angle: 10
   g4:
      angle: 100
sinks: [c1, c2, c3, c4, s1u, s1l, s2u, s2l, s3u, s3l, s4u, s4l]
links:
   control1: g1.control
   control2: g2.control
   control3: g3.control
   control4: g4.control
   p1: g1.upper
   p2: g2.upper
   p3: g3.upper
   p4: g4.upper
   g1.control: c1
   g1.upper: s1u
   g1.lower: s1l
   g2.control: c2
   g2.upper: s2u
   g2.lower: s2l
   g3.control: c3
   g3.upper: s3u
   g3.lower: s3l
   g4.control: c4
   g4.upper: s4u
   g4.lower: s4l