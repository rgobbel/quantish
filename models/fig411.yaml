title: Figure 4.11
symbolic: false

sample: true
n_samples: 10000
#loglevel: info

#merge:
#   before_measure: false
#   before_forwarding: false
#   combine_signs: false
#normalize_weights:
#   output: false
#   input: false
#probability_threshold:
#   selector: -3
#   swap: -3
#   forwarding: -3
#   presence: 0
#   forwarding: 0
#string_precision: 2
always_forward:
   control_weights: false
   switch_weights: false

variables:
   zero: &zero '0j'
   one: &one '1+0j'
   r60: &r60 '0.5+0.87j'
   q1: &q1 'rad(15)'
   q2: &q2 'rad(45)'
   q15: &q15 'rad(15)'
   q30: &q30 'rad(30)'
   q45: &q45 'rad(45)'

run_stages:
   g1: [g1]
   g2: [g2]
   measure_1: [g3]
   measure_2: [g4]

particles:
#   c:
#      sign: 1
#      weight: *zero
   p1:
      sign: 1
      weight: *one
   p2:
      sign: 1
      weight: *one
   p3:
      sign: 1
      weight: *one

gates:
   g1: {angle: 'rad(30)'}
   g2: {angle: 'rad(75)'}
   g3: {angle: 0}
   g4: {angle: 0}

links:
#   c: g1.control
   p1: g1.upper
   p2: g3.upper
   p3: g4.upper
   g1.control: g2.control
   g1.upper: g2.upper
#   g1.lower: g2.lower
   g2.upper: g3.control
   g2.lower: g4.control
