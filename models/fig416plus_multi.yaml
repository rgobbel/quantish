title: Quantish EPR Experiment

symbolic: false

diagram_groups:
   prepare: [g1, g2]
   couple: [g3, g4]
   observe: [g5, g6]

sample: false
n_samples: 1000
measure_discrepancy: true
epr_stats: false

variables:
   zero: &zero '0+(I*0)'
   one: &one '1+(I*0)'
   minus_one: &minus_one '-1+(I*0)'
   eye: &eye 'I'
   minus_eye: &minus_eye '-I'
   pi8pi8: &pi8pi8 '0.39269908169872414+0.39269908169872414j'
   cweight: &cweight '1'
   q0: &q0 '0'
   q10: &q10 'rad(10)'
   q15: &q15 'rad(15)'
   q20: &q20 'rad(20)'
   qp8: &qp8 'pi/8'
   q30: &q30 'rad(30)'
   q35: &q35 'rad(35)'
   q40: &q40 'rad(40)'
   q45: &q45 'rad(45)'
   q60: &q60 'rad(60)'
   q90: &q90 'rad(90)'
   q100: &q100 'rad(100)'
   q120: &q120 'rad(30+90)'
   q150: &q150 'rad(2*30+90)'
   q135: &q135 'rad(135)'
   q180: &q180 'rad(180)'
   q210: &q210 'rad(30+180)'
   qr34: &qr34 'acos(3/4)'
   qr45: &qr45 'acos(4/5)'
   qm45: &qm45 '-rad(45)'
   qm60: &qm60 '-rad(60)'
   cw: &cw '0'

   q1: &q1 'rad(30)'
   q2: &q2 '0'
   qa: &qa '0'
   qb: &qb 'pi/8'
   qc: &qc 'pi/4'

particles:
   p1: {weight: 1, sign: 1}
   p2: {weight: 1, sign: 1}
   p3: {weight: *one, sign: 1}

gates:
   g1: {angle: 'rad(30)'}
   g2: {angle: 'rad(30)+pi/2'}
   g3: {angle: 0}
   g4: {angle: 0}
   g5: {angle: 'pi/8'}
   g6: {angle: 'pi/4'}

links:
   # particles
   p1: g1.upper
   p2: g2.upper
   p3: g3.upper

   # phase 1 - split
   g1.upper: g3.control
   g1.lower: g5.lower

   g2.upper: g4.control
   g2.lower: g6.lower

   # phase 2a - couple from g1
   g3.control: g5.upper
   g3.upper: g4.upper
   g3.lower: g4.lower

   # phase 2b - couple from g2
   g4.control: g6.upper

   # g5 and g6 have no oher gates as output