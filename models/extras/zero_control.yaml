title: Computed zero control input

symbolic: false

variables:
   zero: &zero "0+0j"
   one: &one "1+0j"
   eye: &eye "1j"
   r60: &r60 "0.5+0.87j"
   q345: &q345 "acos(4/5)"
   q30: &q30 "rad(30)"
   q45: &q45 "rad(45)"

run_stages:
   split: [g1]
   unsplit: [g2]
   test: [g3, g4]

particles:
   p1: {sign: 1, weight: 1}
   p2: {sign: 1, weight: 1}
   p3: {sign: 1, weight: 1}

gates:
   g1: {angle: 0}
   g2: {angle: *q30}
   g3: {angle: 0}
   g4: {angle: 0}

links:
   p1: g1.upper
   p2: g3.upper
   p3: g4.upper

   g1.control: g2.control
   g1.upper: g2.upper
   g1.lower: g2.lower

   g2.upper: g3.control
   g2.lower: g4.control

