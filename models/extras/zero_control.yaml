title: Computed zero control input

calculation_mode: float

run_stages:
   split: [g1]
   unsplit: [g2]
   test: [g3, g4]

particles:
   p1: {sign: 1, weight: 1}
   p2: {sign: 1, weight: 1}
   p3: {sign: 1, weight: 1}

angle_unit: degrees

gates:
   g1: {angle: 0}
   g2: {angle: 30°}
   g3: {angle: 0}
   g4: {angle: 0}

links:
   p1: g1.upper
   p2: g3.upper
   p3: g4.upper

   g1.control: g2.control
   g1.upper: g2.upper
   g1.lower: g2.lower

   g2.upper: g3.control
   g2.lower: g4.control
