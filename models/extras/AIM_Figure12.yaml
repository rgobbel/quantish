title: Quantish EPR Experiment, as described in AIM-1026a

caption: Figure 12 of AIM-1026a — p1 and p2 start with attribute vectors parallel to (1,1); p3 emerges at w1 exactly when their attributes agree, leaving them coupled.

notes: |-
  A faithful transcription of the memo's figure 12b. The memo's split
  gates carry measurement vector (1,0) with both particles' attribute
  vectors at 45°; in the chapter's formalism that relative angle is the
  gate angle, so the split and merge gates measure at 45°. The couple
  stage's angle-0 gates route p3 by control occupancy alone: it crosses
  at g3 iff p1 took its + wire and at g4 iff p2 did, so p3 ends on w1
  exactly when the attributes agree.

calculation_mode: float

run_stages:
   split: [g1, g2]
   couple: [g3, g4]
   merge: [g5, g6]

particles:
   p1: {sign: 1, weight: 1}
   p2: {sign: 1, weight: 1}
   p3: {sign: 1, weight: 1}

gates:
   g1: {angle: 45°}
   g2: {angle: 45°}
   g3: {angle: 0}
   g4: {angle: 0}
   g5: {angle: 45°}
   g6: {angle: 45°}

links:
   p1: g1.upper
   p2: g2.upper
   p3: g3.upper
   g1.upper: g3.control
   g1.lower: g5.lower
   g2.upper: g4.control
   g2.lower: g6.lower
   g3.control: g5.upper
   g3.upper: g4.upper
   g3.lower: g4.lower
   g4.control: g6.upper

wire_labels:
   g4.upper: $w_1$
   g4.lower: $w_2$
