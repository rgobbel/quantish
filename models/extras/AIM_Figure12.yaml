title: Quantish EPR Experiment, as described in AIM-1026a

calculation_mode: float

run_stages:
   prepare: [g1, g2]
   couple: [g3, g4]
   split: [g5, g6]

variables:
   q1: "rad(30)"
   q3: "rad(30)+pi/2"
   q45: "sqrt(2)/2+sqrt(2)*I/2"
   qm45: "sqrt(2)/2-sqrt(2)*I/2"
   qpythag: "acos(4/5)"

particles:
   control1: {sign: 1, weight: 0}
   control2: {sign: 1, weight: 0}
   p1: {sign: 1, weight: q45}
   p2: {sign: 1, weight: qm45}
   p3: {sign: 1, weight: 1}

gates:
   g1: {angle: q1}
   g2: {angle: q3}
   g3: {angle: 0}
   g4: {angle: 0}
   g5: {angle: qpythag}
   g6: {angle: qpythag}

links:
   control1: g1.control
   control2: g2.control
   p1: g1.upper
   p2: g2.upper
   p3: g3.upper
   g1.upper: g3.control
   g1.lower: g5.lower
   g2.upper: g4.control
   g2.lower: g6.lower
   g3.control: g5.upper
   g3.upper: g4.upper
   g3.lower: g4.lower
   g4.control: g6.upper
