title: Split - observe

calculation_mode: float

variables:
   q30: "rad(30)"

run_stages: 
   split1: [g1]
   observe: [g3]
   split2: [g2]

particles:
   p1: {sign: 1, weight: 1}
   p2: {sign: 1, weight: 1}

gates:
   g1: {angle: q30}
   g2: {angle: q30}
   g3: {angle: 0}

links:
   p1: g1.upper
   p2: g3.upper
   g1.control: g2.control
   g1.upper: g2.upper
   g1.lower: g3.control
   g3.control: g2.lower
