title: Double slit, left slit blocked (one pixel)

caption: One screen pixel of the double-slit apparatus with the left slit blocked — the block B1 diverts g_split's upper output away (figure 4.14, 2026 numbering), so only the right slit's path, through the phase plate, reaches the remerge gate.

notes: |-
  The "left slit blocked" condition of the double-slit app: the same
  circuit as double_slit.yaml with the block B1 in place of the slit
  S1. Only the right slit's path reaches g_merge; the phase plate still
  rotates it by the pixel's path-length phase, but with nothing to
  interfere with, the rotation changes no probability — the screen
  shows a flat line at the right slit's intensity. Per screen pixel
  the app overrides phi with that pixel's phase.

variables:
   theta_split: 45°
   theta_merge: 45°
   theta_sort: 0
   phi: 0

run_stages:
   split: [g_split]
   slits: [B1, S2]
   phase: [φ]
   merge: [g_merge]
   sort: [g_sort]
   detect: [S, D]

particles:
   p1: {sign: 1, weight: 1}

gates:
   g_split: {angle: theta_split, angle_range: [0, 90]}
   g_merge: {angle: theta_merge, angle_range: [0, 90]}
   g_sort: {angle: theta_sort, angle_range: [0, 90]}

delay_gates: [B1, S2, S, D]

phase_plates:
   φ: phi

display_strings:
   g_split: '$g_{split}$'
   g_merge: '$g_{merge}$'
   g_sort: '$g_{sort}$'

links:
   p1: g_split.upper
   g_split.upper: B1
   g_split.lower: S2
   S2: φ
   φ: g_merge.lower
   g_merge.upper: g_sort.upper
   g_sort.upper: S
   g_sort.lower: D
