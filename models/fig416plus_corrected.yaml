title: Quantish EPR Experiment - Corrected

phases:
   prepare: [g1, g2]
   couple: [g3, g4]
   split: [g5, g6]

merge:
   combine_signs: true
   combine_names: true

sample: true
n_samples: 1000
measure_discrepancy: true

variables:
   zero: &zero "0+0j"
   one: &one "1+0j"
   qa: &qa 0
   qb: &qb "pi/8"        # 22.5 degrees
   qc: &qc "pi/4"        # 45 degrees
   q30: &q30 "rad(30)"   # For preparation

particles:
   p1: {weight: *one, sign: 1}
   p2: {weight: *one, sign: 1}
   p3: {weight: *one, sign: 1}

gates:
   g1: {angle: *q30}       # Prepare p1
   g2: {angle: *q30}       # Prepare p2 (with orthogonal offset via sign)
   g3: {angle: 0}          # Coupling gate 1
   g4: {angle: 0}          # Coupling gate 2
   g5: {angle: *qb}        # Measure p1 at angle qb
   g6: {angle: *qc}        # Measure p2 at angle qc

links:
   # Initial inputs
   p1: g1.upper
   p2: g2.upper
   p3: g3.control

   # p1 path: g1 -> g3.upper (observed by p3 at g3.control) -> g5 split
   g1.upper: g3.upper
   g1.lower: g3.lower

   # p2 path: g2 -> g4.upper (observed by p3 at g4.control) -> g6 split
   g2.upper: g4.upper
   g2.lower: g4.lower

   # p3 path: observes at g3.control, then at g4.control
   # After coupling is complete at g4, forward to measurement gates
   g3.control: g4.control

   # AFTER coupling (g3 and g4), p1 and p2 go to measurement
   # p1 path continues: g3 -> g5
   g3.upper: g5.upper
   g3.lower: g5.lower

   # p2 path continues: g4 -> g6
   g4.upper: g6.upper
   g4.lower: g6.lower