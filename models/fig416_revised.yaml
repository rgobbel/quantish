title: Quantish EPR Experiment

symbolic: false

loglevel: debug

run_stages:
   prep1: g1
   prep2: g2
   couple1: g3
   couple2: g4
   observe11: g5
   observe12: g6
   observe21: g7
   observe22: g8

diagram_groups:
   prepare: [g1, g2]
   couple: [g3, g4]
   observe1: [g5, g6]
   observe2: [g7, g8]

measure_discrepancy: true
epr_stats: true

variables:
   q1: &q1 'rad(45)'
   q2: &q2 'rad(45)'
   qa: &qa '0'
   qb: &qb 'pi/4'
   qc: &qc 'pi/4'

particles:
   p1: {sign: 1}
   p2: {sign: 1}
   p3: {sign: 1}

gates:
   g1: {angle: 'rad(30)'}
   g2: {angle: 'rad(30)+rad(90)'}
   g3: {angle: 0}
   g4: {angle: 0}
   g5: {angle: 'rad(30)'}
   g6: {angle: 'rad(30)'}
   g7: {angle: 'rad(30)'}
   g8: {angle: 'rad(30)'}
#   g9: {angle: 0}
#   g10: {angle: 0}

links:
   # particles
   p1: g1.upper
   p2: g2.upper
   p3: g3.upper

   # phase 1 - split
   g1.upper: g3.control
   g1.lower: g5.lower


   # phase 2a - couple from g1
   g3.control: g5.upper
   g3.upper: g4.upper
   g3.lower: g4.lower

#   g6.control: g5.control

   # phase 2b - couple from g2
   g2.upper: g4.control
   g4.control: g6.upper
   g2.lower: g6.lower

   g5.control: g7.control
   g5.upper: g7.upper
   g5.lower: g7.lower

   g6.control: g8.control
   g6.upper: g8.upper
   g6.lower: g8.lower