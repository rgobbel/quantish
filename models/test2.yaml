title: Test 2
variables:
   zero: &zero !!python/complex 0j
   one: &one !!python/complex (1+0j)
   q1: &q1 !RandomAngle
   q2: &q2 !RandomAngle
   q3: &q3
      base: *q1
      rotation: -90
phases:
   phase1: [g1]
   phase2: [g2]
particles:
   control1:
      position: g1.control
      sign: true
      weight: *zero
   control2:
      position: g2.control
      sign: true
      weight: *one
   p1:
      position: g1.in1
      sign: true
      weight: *one
   p2:
      position: g1.in2
      sign: false
      weight: *one
gates:
   g1: {angle: 15}
   g2: {angle: 45}
links:
   g1.out1: g2.in1
   g1.out2: g2.in2
outputs:
   g2.out1: out1
   g2.out2: out2
