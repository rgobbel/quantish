title: Figure 4.14
symbolic: false

sample: true
n_samples: 1000

variables:
   zero: &zero '0j'
   one: &one '1+0j'
   r60: &r60 '0.5+0.87j'
   q1: &q1 'rad(20)'
   q2: &q2 'rad(30)'
   q15: &q15 'rad(15)'
   q40: &q40 'rad(40)'
   q45: &q45 'rad(45)'
   q30: &q30 'rad(30)'
   q60: &q60 'rad(60)'
   q85: &q85 'rad(85)'
   q10: &q10 'rad(10)'
   q120: &q120 'rad(120)'

run_stages:
   prepare: [g1]
   observe: [g3]
   unsplit: [g2]

particles:
   p1: {sign: 1, weight: *one}
   p2: {sign: 1, weight: *one}

gates:
   g1: {angle: 'rad(30)'}
   g2: {angle: 'rad(30)'}
   g3: {angle: 'rad(0)'}
#   d1: {angle: 0}
#   d2: {angle: 0}

#delay_gates: [d1, d2]

links:
   p1: g1.upper
   p2: g3.upper

#   g1.control: d1.control
#   g1.upper: d2.control
   g1.control: g2.control
   g1.upper: g2.upper
   g1.lower: g3.control

#   d1.control: g2.control
#   d2.control: g2.upper
   g3.control: g2.lower
