title: Figure 4.15
symbolic: false
#merge:
#   before_measure: false
#   before_forwarding: false
#   combine_signs: true
#normalize_weights:
#   output: false
#   input: false
#probability_threshold:
#   swap: 0
#   forwarding: -3
#   control: -3
#   presence: 0
always_forward:
   switch_weights: false
   control_weights: false
#swap_if_selected: false
#string_precision: 2

sample: true
loglevel: warning
n_samples: 1000

variables:
   zero: &zero '0j'
   one: &one '1+0j'
   r60: &r60 '0.5+0.87j'
   q1: &q1 'rad(30)'
   q2: &q2 'rad(20)'
   q15: &q15 'rad(15)'
   q30: &q30 'rad(30)'
   q60: &q60 'rad(60)'

run_stages:
#   run_all: [g0, g1, g4, g5, g2, g3]
   prepare: [g1]
#   split: [g1]
   observe: [g3]
   unobserve: [g4]
#   merge: [g2]
   test: [g2]

diagram_groups:
   prep_split: [g1]
   observe_unobserve: [g3, g4]
   merge_test: [g2]

particles:
   p1: {sign: 1, weight: *one}
   p2: {sign: 1, weight: *one}

gates:
   g1: {angle: 'rad(45)'}
   g2: {angle: 'rad(45)'}
   g3: {angle: 0}
   g4: {angle: 0}

links:
   p1: g1.upper
   p3: g4.upper
   g1.control: g2.control
   g1.upper:   g2.upper
   g1.lower:   g3.control
#   g1.control: g2.control
#   g1.upper:   g2.upper
#   g1.lower:   g4.control
#   g2.control: g3.control
#   g2.upper:   g3.upper
#   g2.lower:   g3.lower
   g3.control: g4.control
   g3.upper:   g4.upper
   g3.lower:   g4.lower
   g4.control: g2.lower
