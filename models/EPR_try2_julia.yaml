title: Quantish EPR Experiment
variables:
   zero: &zero 0im
   one: &one 1+0im
   q1: &q1 10
   q2: &q2 20
   q3: &q3
      base: *q1
      rotation: 90
phases:
   prepare: [g1, g2]
   couple: [g3, g4]
   split: [g5, g6]
particles:
#   control0:
#      position: null
#      spin: true
#      weight: *zero
#   control1:
#      position: null
#      spin: true
#      weight: *one
#   pnull:
#      position: null
#      spin: true
#      weight: *zero
   p1:
      position: g1_in1
      sign: true
      weight: *one
   p2:
      position: g2_in1
      sign: false
      weight: *one
   p3:
      position: g3_in1
      sign: true
      weight: *one
gates:
   g1:
      angle: q1
   g2:
      angle: q3
   g3:
      angle: 0
   g4:
      angle: 0
   g5:
      angle: *q2
   g6:
      angle: *q2
links:
   p1: g1_in1
   p2: g2_in1
   p3: g3_in1
   g1_out1: g3_control
   g1_out2: g5_in2
   g2_out1: g4_control
   g2_out2: g6_in2
   g3_control: g5_in1
   g3_out1: g4_in1
   g3_out2: g4_in2
   g4_control: g6_in1
   g5_out1: sp1
   g5_out2: sp1
   g6_out1: sp2
   g6_out2: sp2
   g4_out1: sp3
   g4_out2: sp3
sinks:
   sp1: [g5_out1, g5_out2]
   sp2: [g6_out1, g6_out2]
   sp3: [g4_out1, g4_out2]
