title: Split - observe

symbolic: false

variables:
   zero: &zero "0+0j"
   one: &one "1+0j"
   eye: &eye "1j"
   r60: &r60 "0.5+0.87j"
   q345: &q345 "acos(4/5)"
   q30: &q30 "rad(30)"
   q45: &q45 "rad(45)"

run_stages: &rs
   split1: [g1]
   observe: [g3]
   split2: [g2]

diagram_groups: *rs

particles:
   p1: {weight: *one, sign: 1}
   p2: {weight: *one, sign: 1}

gates:
   g1: {angle: *q30}
   g2: {angle: *q30}
   g3: {angle: 0}


links:
   p1: g1.upper
   p2: g3.upper
   g1.control: g2.control
   g1.upper: g2.upper
   g1.lower: g3.control
   g3.control: g2.lower
