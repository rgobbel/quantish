title: Figure 4.14
symbolic: false
merge:
   before_measure: false
   before_forwarding: false
   combine_signs: true
normalize_weights:
   output: false
   input: false
probability_threshold:
   selector: -3
   control: 0
   forwarding: 0
   presence: 0
winner_take_all: false
string_precision: 2

sample: true
n_samples: 1000
loglevel: warning

variables:
   zero: &zero '0j'
   one: &one '1+0j'
   r60: &r60 '0.5+0.87j'
   q1: &q1 'rad(15)'
   q2: &q2 'rad(30)'
   q40: &q40 'rad(40)'
   q30: &q30 'rad(30)'
   q60: &q60 'rad(60)'
   q10: &q10 'rad(10)'
   q120: &q120 'rad(120)'

run_stages:
   _prepare: [prepare]
   _split: [split]
   _observe: [observe]
   _test: [unsplit, test]
particles:
   p1:
      sign: 1
      weight: *one
   p2:
      sign: 1
      weight: *one
gates:
   prepare:
      angle: *q1
   split:
      angle: *q2
   unsplit:
      angle: *q2
   test:
      angle: *q1
   observe:
      angle: 0
links:
   p1: prepare.upper
   p2: observe.upper
   prepare.control: split.control
   prepare.upper: split.upper
   split.control: unsplit.control
   split.upper: unsplit.upper
   split.lower: observe.control
   unsplit.control: test.control
   unsplit.upper: test.upper
   unsplit.lower: test.lower
   observe.control: unsplit.lower
