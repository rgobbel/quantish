title: Figure 4.9
symbolic: false
merge:
   before_measure: false
   before_forwarding: false
   combine_signs: true
normalize_weights:
   output: false
   input: false
probability_threshold:
   control: 0
   forwarding: 0
   presence: 0
winner_take_all: true
string_precision: 2
#alternative_measure: cpair3

sample: true
n_samples: 100

variables:
   zero: &zero  "0j"
   one: &one  "1+0j"
   r60: &r60  "0.5+0.87j"
   q: &q "rad(20)"
   q90: &q90 "rad(90)"
   q345: &q345 "acos(4/5)"
phases:
   phase1: [g1]
   phase2: [g2, g3]
particles:
   c:
      sign: 1
      weight: *zero
   p1:
      sign: 1
      weight: *one
   p2:
      sign: 1
      weight: *one
   p3:
      sign: 1
      weight: *one
gates:
   g1:
      angle: 0
   g2:
      angle: 0
   g3:
      angle: 0
links:
   c: g1.control
   p1: g1.upper
   p2: g2.upper
   p3: g3.upper
   g1.upper: g2.control
   g1.lower: g3.control
