title: Quantish EPR Experiment

run_stages: &rs
   prepare: [g1, g2]
   no_op: [g3, g4]
#   couple: [d1, g3, d2, d3, d4, d5, g4, d6]
#   couple: [g3, g4]
   split: [g5, g6]
#   final: [g7]

diagram_groups: *rs

sample: true
n_samples: 1000
loglevel: warning
measure_discrepancy: true

#probability_threshold:
#   # selector: >= 0: constant
#   #             -1: random constant
#   #             -2: random phase between 0 and pi/2
#   #             -3: random, calculated every time
#   control: 0
merge:                      # whether or not to merge measurement results before processing
   before_measure: false    # merge on the way in
   before_forwarding: false # merge on the way out
   combine_signs: true      # combine particles of opposite signs
   add_with_signs: false     # multiply by sign when adding particles
   combine_names: true

normalize_weights:          # whether or not to normalize weights so that their sum is one
   input: false             # normalize values of input particles before measurement
   output: false            # normalize values of output particles before returning from measurement
always_forward_weights: true

variables:
   zero: &zero "0+0j"
   one: &one "1+0j"
   minus_one: &minus_one "-1+0j"
   cweight: &cweight "1"
   q0: &q0 "0"
   q10: &q10 "rad(10)"
   q15: &q15 "rad(15)"
   q20: &q20 "rad(20)"
   qp8: &qp8 'pi/8'
   q30: &q30 "rad(30)"
   q35: &q35 "rad(35)"
   q40: &q40 "rad(40)"
   q45: &q45 "rad(45)"
   q60: &q60 "rad(60)"
   q90: &q90 "rad(90)"
   q100: &q100 "rad(100)"
   q120: &q120 "rad(30+90)"
   q135: &q135 "rad(135)"
   q210: &q210 "rad(210)"
#   q2: &q2 "acos(1/3)"
   qr34: &qr34 "acos(3/4)"
   qr45: &qr45 "acos(4/5)"
   qm45: &qm45 "-rad(45)"
   qm60: &qm60 "-rad(60)"
   cw: &cw "0"
   qa: &qa '0'
   qb: &qb 'pi/8'
   qc: &qc 'pi/4'
particles:
#   control1:
#      sign: 1
#      weight: *zero
#   control2:
#      sign: 1
#      weight: *zero
   p1:
      sign: 1
      weight: *one
   p2:
      sign: -1
      weight: *one
   p3:
      sign: 1
      weight: *one
gates:
   g1:
      angle: 'rad(30)'
   g2:
      angle: 'rad(30)'
   g3:
      angle: 0
   g4:
      angle: 0
   g5:
      angle: 0
   g6:
      angle: 0
#   g7:
#      angle: *zero
#   d1: {angle: 0}
#   d2: {angle: 0}
#   d3: {angle: 0}
#   d4: {angle: 0}
#   d5: {angle: 0}
#   d6: {angle: 0}

#delay_gates: [d1, d2, d3, d4, d5, d6]

links:
#   control1: g1.control
#   control2: g2.control
   p1: g1.upper
   p2: g2.upper
   p3: g3.upper
   g1.upper: g5.upper
   g1.lower: g5.lower
#   g1.lower: d1.control
#   d1.control: d5.control
#   d5.control: g5.lower
#   g2.upper: d2.control
#   d2.control: g4.control
   g2.upper: g6.upper
   g2.lower: g6.lower
#   d3.control: d6.control
#   d6.control: g6.lower
#   g2.lower: g6.lower
#   g3.control: d4.control
#   d4.control: g5.upper
#   g3.control: g5.upper
   g3.upper: g4.upper
#   g3.lower: g4.lower
#   g4.control: g6.upper
#   g5.upper: g7.upper
#   g5.lower: g7.lower
#   g6.upper: g7.upper
#   g6.lower: g7.lower
