title: Figure 4.10

caption: Particles *p2* and *p3* observe *p1*’s position.

variables:
   q30: 30°

run_stages:
   split: [g1]
   test: [g2, g3]

particles:
   p1: {sign: 1, weight: 1}
   p2: {sign: 1, weight: 1}
   p3: {sign: 1, weight: 1}

gates:
   g1: {angle: q30}
   g2: {angle: 0}
   g3: {angle: 0}

links:
