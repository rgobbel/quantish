title: Figure 4.9

# Figure 4.7's circuit (both switch wires reconnected to the second gate),
# but with differing measurement angles Q1 and Q2 — new figure in the 2026
# revised draft. With Q1 != Q2 the second gate no longer undoes the first:
# states split at rate sin²(Q1−Q2).

caption: Here, the angles $Q_1$ and $Q_2$ may differ

run_stages:
   split1: [g1]
   split2: [g2]

particles:
   p1: {sign: 1, weight: 1}

gates:
   g1: {angle: 30°}
   g2: {angle: 45°}

links:
   p1: g1.upper

   g1.control: g2.control
   g1.upper: g2.upper
   g1.lower: g2.lower

# the book's wire-segment names: w2 carries p1, a = between the gates,
# b = after g2; '>' marks an empty input, an unlinked port an empty output
wire_labels:
   '>g1.control': $w_1$
   p1: $w_2$
   '>g1.lower': $w_3$
   g1.control: $w_{1a}$
   g1.upper: $w_{2a}$
   g1.lower: $w_{3a}$
   g2.control: $w_{1b}$
   g2.upper: $w_{2b}$
   g2.lower: $w_{3b}$
