title: Figure 4.9

# Figure 4.7's circuit (both switch wires reconnected to the second gate),
# but with differing measurement angles Q1 and Q2 — new figure in the 2026
# revised draft. With Q1 != Q2 the second gate no longer undoes the first:
# states split at rate sin²(Q1−Q2).

variables:
   one: &one "1+0j"
   q1: 'rad(30)'
   q2: 'rad(45)'

run_stages:
   split1: [g1]
   split2: [g2]

particles:
   p1: {sign: 1, weight: *one}

gates:
   g1: {angle: q1}
   g2: {angle: q2}

links:
   p1: g1.upper

   g1.control: g2.control
   g1.upper: g2.upper
   g1.lower: g2.lower
