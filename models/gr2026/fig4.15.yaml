title: Figure 4.15

variables:
   zero: &zero '0j'
   one: &one '1+0j'
   r60: &r60 '0.5+0.87j'
   q1: &q1 'rad(20)'
   q2: &q2 'rad(30)'
   q15: &q15 'rad(15)'
   q40: &q40 'rad(40)'
   q45: &q45 'rad(45)'
   q30: &q30 'rad(30)'
   q60: &q60 'rad(60)'
   q85: &q85 'rad(85)'
   q10: &q10 'rad(10)'
   q120: &q120 'rad(120)'

run_stages:
   prepare: [g0]
   split: [g1]
   observe: [g4]
