title: Figure 4.15

caption: An observation circumvents subsequent interference.

run_stages:
   prepare: [g0]
   split: [g1]
   observe: [g4]
   unsplit: [g2]
   test: [g3]

particles:
   p1: {sign: 1, weight: 1}
   p2: {sign: 1, weight: 1}

gates:
   g0: {angle: 30°}
   g1: {angle: 20°}
   g2: {angle: 20°}
   g3: {angle: 30°}
   g4: {angle: 0}

links:
   p1: g0.upper
   p2: g4.upper
   # ----
   g0.control: g1.control
   g0.upper: g1.upper
# the omitted lower wire is the point of this figure:
#   g0.lower: g1.lower
   # ----
   g1.control: g2.control
   g1.upper:   g2.upper
   g1.lower: g4.control
   # ----
   g4.control: g2.lower
   # ----
   g2.control: g3.control
   g2.upper: g3.upper
   g2.lower: g3.lower

# the book labels only the prepare gate's inputs in this figure
wire_labels:
   '>g0.control': $w_1$
   p1: $w_2$
   '>g0.lower': $w_3$
