title: Figure 4.13 (fully connected)

caption: If we connect the lower switch wire of *g1* as well as the control and upper wires, *p1* emerges in its original state.

run_stages:
   prepare: [g0]
   split: [g1]
   merge: [g2]
   test: [g3]

particles:
   p1: {sign: 1, weight: 1}

gates:
   g0: {angle: 30°}
   g1: {angle: 45°}
   g2: {angle: 45°}
   g3: {angle: 30°}

links:
   p1: g0.upper

   g0.control: g1.control
   g0.upper: g1.upper
   g0.lower: g1.lower

   g1.control: g2.control
   g1.upper: g2.upper
   g1.lower: g2.lower

   g2.control: g3.control
   g2.upper: g3.upper
   g2.lower: g3.lower
