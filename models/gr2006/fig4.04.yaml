title: Figure 4.4

caption: A classical state with weight *$c_1$* splits into four successors.

run_stages:
   stage1: [g1]

particles:
   p1: {sign: 1, weight: 1}

gates:
   g1: {angle: 30°}

links:
   p1: g1.upper

# the book's wire-segment names (fig 4.4a): w2 carries p1, w1 the
# zero-weight control particle; a = the gate's outputs
wire_labels:
   '>g1.control': $w_1$
   p1: $w_2$
   '>g1.lower': $w_3$
   g1.control: $w_{1a}$
   g1.upper: $w_{2a}$
   g1.lower: $w_{3a}$
