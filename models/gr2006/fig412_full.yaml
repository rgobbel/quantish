title: Figure 4.12 (fully connected)

variables:
   zero: &zero "0j"
   one: &one "1+0j"
   r60: &r60 "0.5+0.87j"
   q15: &q15 'rad(15)'
   q30: &q30 'rad(30)'
   q40: &q40 'rad(40)'
   q45: &q45 'rad(45)'
   q60: &q60 'rad(60)'
   q85: &q85 'rad(85)'
   q2: &q2 "acos(4/5)"
   q3: &q3 '0.8+0.6j'
   q4: &q4 'rad(15)'

run_stages:
   prepare: [g0]
   split: [g1]
   merge: [g2]
   test: [g3]

particles:
   p1: {sign: 1, weight: *one}

gates:
   g0: {angle: 'rad(30)'}
   g1: {angle: 'rad(45)'}
   g2: {angle: 'rad(45)'}
   g3: {angle: 'rad(30)'}

links:
   p1: g0.upper

   g0.control: g1.control
   g0.upper: g1.upper
   g0.lower: g1.lower

   g1.control: g2.control
   g1.upper: g2.upper
   g1.lower: g2.lower

   g2.control: g3.control
   g2.upper: g3.upper
   g2.lower: g3.lower
