title: Figure 4.11

caption: An observation distinguishes between two outcomes of passing *p1* through a succession of gates with distinct measurement angles.

run_stages:
   g1: [g1]
   g2: [g2]
   measure_1: [g3]
   measure_2: [g4]

particles:
   p1: {sign: 1, weight: 1}
   p2: {sign: 1, weight: 1}
   p3: {sign: 1, weight: 1}

gates:
   g1: {angle: 'rad(30)'}
   g2: {angle: 'rad(75)'}
   g3: {angle: 0}
   g4: {angle: 0}

links:
   p1: g1.upper
   p2: g3.upper
   p3: g4.upper

   g1.control: g2.control
   g1.upper: g2.upper
# the omitted lower wire is the point of this figure:
#   g1.lower: g2.lower

   g2.upper: g3.control
   g2.lower: g4.control

# the book's wire-segment names for the g1-g2 chain (the observer gates
# g3/g4 are unlabeled in the figure)
wire_labels:
   '>g1.control': $w_1$
   p1: $w_2$
   '>g1.lower': $w_3$
   g1.control: $w_{1a}$
   g1.upper: $w_{2a}$
   g1.lower: $w_{3a}$
   g2.control: $w_{1b}$
   g2.upper: $w_{2b}$
   g2.lower: $w_{3b}$
