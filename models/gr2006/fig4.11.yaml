title: Figure 4.11

caption: An observation distinguishes between two outcomes of passing *p1* through a succession of gates with distinct measurement angles.

variables:
   one: &one '1+0j'
   r60: &r60 '0.5+0.87j'
   q1: &q1 'rad(15)'
   q2: &q2 'rad(45)'
   q15: &q15 'rad(15)'
   q30: &q30 'rad(30)'
   q45: &q45 'rad(45)'

run_stages:
   g1: [g1]
   g2: [g2]
   measure_1: [g3]
   measure_2: [g4]

particles:
   p1: {sign: 1, weight: *one}
   p2: {sign: 1, weight: *one}
   p3: {sign: 1, weight: *one}

gates:
   g1: {angle: 'rad(30)'}
   g2: {angle: 'rad(75)'}
   g3: {angle: 0}
   g4: {angle: 0}

links:
   p1: g1.upper
   p2: g3.upper
   p3: g4.upper

   g1.control: g2.control
   g1.upper: g2.upper
# the omitted lower wire is the point of this figure:
#   g1.lower: g2.lower

   g2.upper: g3.control
   g2.lower: g4.control

# the book's wire-segment names for the g1-g2 chain (the observer gates
# g3/g4 are unlabeled in the figure)
wire_labels:
   '>g1.control': w1
   p1: w2
   '>g1.lower': w3
   g1.control: w1a
   g1.upper: w2a
   g1.lower: w3a
   g2.control: w1b
   g2.upper: w2b
   g2.lower: w3b
