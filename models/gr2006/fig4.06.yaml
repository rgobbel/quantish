title: Figure 4.6

caption: As in figure 4.5, reusing the same measurement angle causes no further state splitting.

variables:
   zero: &zero "0+0j"
   one: &one "1+0j"
   r60: &r60 "0.5+0.87j"
   q345: &q345 "acos(4/5)"
   q30: &q30 "rad(30)"
   q45: &q45 "rad(45)"

run_stages:
   split1: [g1]
   split2: [g2]

particles:
   p1: {sign: 1, weight: *one}

gates:
   g1: {angle: *q30}
   g2: {angle: *q30}

links:
   p1: g1.upper

   g1.control: g2.control
   g1.lower: g2.lower
