title: Figure 4.6

caption: Again, reusing the same measurement angle causes no further state-splitting.

variables:
   q30: "rad(30)"

run_stages:
   split1: [g1]
   split2: [g2]

particles:
   p1: {sign: 1, weight: 1}

gates:
   g1: {angle: q30}
   g2: {angle: q30}

links:
   p1: g1.upper

   g1.control: g2.control
   g1.lower: g2.lower

# the book's wire-segment names: a = between the gates, b = after g2;
# '>' marks an empty input, an unlinked port an empty output
wire_labels:
   '>g1.control': $w_1$
   p1: $w_2$
   '>g1.lower': $w_3$
   g1.control: $w_{1a}$
   g1.upper: $w_{2a}$
   g1.lower: $w_{3a}$
   g2.control: $w_{1b}$
   g2.upper: $w_{2b}$
   g2.lower: $w_{3b}$
