title: Quantish EPR Experiment

caption: "The coupling stage of the EPR experiment: the observations
   by *p3* at *g3* and *g4* couple *p1* with *p2*."

run_stages:
   prepare: [g1, g2]
   couple: [g3, g4]
   split: [g5, g6]

variables:
   one: &one "1+0j"
   minus_one: &minus_one "-1+0j"
   cweight: &cweight "1"
   q0: &q0 "0"
   q10: &q10 "rad(10)"
   q15: &q15 "rad(15)"
   q20: &q20 "rad(20)"
   q30: &q30 "rad(30)"
   q35: &q35 "rad(35)"
   q40: &q40 "rad(40)"
   q45: &q45 "rad(45)"
   q60: &q60 "rad(60)"
   q90: &q90 "rad(90)"
   q100: &q100 "rad(100)"
   q120: &q120 "rad(30+90)"
   q135: &q135 "rad(135)"
   q210: &q210 "rad(210)"
   q2: &q2 "acos(1/3)"
   qr34: &qr34 "acos(3/4)"
   qr45: &qr45 "acos(4/5)"
   qm45: &qm45 "-rad(45)"
   qm60: &qm60 "-rad(60)"
   cw: &cw "0"

particles:
   p1: {sign: 1, weight: *one}
   p2: {sign: 1, weight: *one}
   p3: {sign: 1, weight: *one}

gates:
   g1: {angle: *q30}
   g2: {angle: *q30}
   g3: {angle: 0}
   g4: {angle: 0}
   g5: {angle: *q20}
   g6: {angle: *q20}

links:
   p1: g1.upper
   p2: g2.lower
   p3: g3.upper

   g1.upper: g3.control
   g1.lower: g5.lower

   g2.upper: g4.control
   g2.lower: g6.lower

   g3.control: g5.upper
   g3.upper: g4.upper
   g3.lower: g4.lower

   g4.control: g6.upper
