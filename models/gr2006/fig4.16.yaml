title: Quantish EPR Experiment

caption: The observations by *p3* at *g3* and *g4* couple *p1* with *p2*.

run_stages:
   prepare: [g1, g2]
   couple: [g3, g4]
   split: [g5, g6]

variables:
   # the printed figure's angle names: Q1 on the prepare gates, Q2 on
   # the splits (the printed g2 showed Q1+pi/2; this model uses the
   # corrected circuit — see models/README.md)
   Q1: 30°
   Q2: 20°

particles:
   p1: {sign: 1, weight: 1}
   p2: {sign: 1, weight: 1}
   p3: {sign: 1, weight: 1}

gates:
   g1: {angle: Q1}
   g2: {angle: Q1}
   g3: {angle: 0}
   g4: {angle: 0}
   g5: {angle: Q2}
   g6: {angle: Q2}

links:
   p1: g1.upper
   p2: g2.lower
   p3: g3.upper

   g1.upper: g3.control
   g1.lower: g5.lower

   g2.upper: g4.control
   g2.lower: g6.lower

   g3.control: g5.upper
   g3.upper: g4.upper
   g3.lower: g4.lower

   g4.control: g6.upper

# the printed figure's own wire labels (verified against the 2006 PDF)
wire_labels:
   g3.control: $w_1$
   g1.lower: $w_2$
   g4.control: $w_3$
   g2.lower: $w_4$
   g5.upper: $w_{1a}$
   g5.lower: $w_{2a}$
   g6.upper: $w_{3a}$
   g6.lower: $w_{4a}$
