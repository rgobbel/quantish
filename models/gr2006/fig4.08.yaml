title: Figure 4.8

caption: Using a succession of different measurement angles makes states split.

run_stages:
   split1: [g1]
   split2: [g2]

particles:
   control: {sign: 1, weight: 0}
   p1: {sign: 1, weight: 1}

gates:
   g1: {angle: 20°}
   g2: {angle: 30°}

links:
   control: g1.control
   p1: g1.upper

   g1.control: g2.control
   g1.upper: g2.upper
# the book diverts the lower wire away (g2's lower input is empty):
#   g1.lower: g2.lower

# the book's wire-segment names: a = between the gates, b = after g2
wire_labels:
   control: $w_1$
   p1: $w_2$
   '>g1.lower': $w_3$
   g1.control: $w_{1a}$
   g1.upper: $w_{2a}$
   g1.lower: $w_{3a}$
   g2.control: $w_{1b}$
   g2.upper: $w_{2b}$
   g2.lower: $w_{3b}$
