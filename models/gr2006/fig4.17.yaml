title: Quantish EPR Experiment

caption: The EPR experiment, a demonstration of *entanglement*. The observations by *p3* at *g3* and *g4* couple *p1* with *p2*.

loglevel: info

run_stages:
   prep: [g1, g2]
   couple1: [g3]
   couple2: [g4]
   observe1: [g5, g6]
   observe2: [g7, g8]

diagram_groups:
   prepare: [g1, g2]
   couple: [g3, g4]
   observe1: [g5, g6]
   observe2: [g7, g8]

sample: false
n_samples: 100
epr_stats: true

variables:
   theta1: '0'
   theta2: '0'

   Qa: 'pi/4'
   Qb: 'pi/8'
   Qc: '3 * pi/8'

   Q1: 'pi/6'
   Q2: 'pi/6'

   Q5: '0'
   Q6: 'pi/4'
   # the book's Q7/Q8, expressed through the sweep's detector settings:
   # the Bell/CHSH machinery rebinds theta1/theta2, and these follow
   Q7: 'theta1'
   Q8: '(Q5 + Q6) - theta2'

particles:
   p1: {sign: 1, weight: 1}
   p2: {sign: 1, weight: 1}
   p3: {sign: 1, weight: 1}

gates:
   g1: {angle: Q1}
   g2: {angle: Q1}
   g3: {angle: 0}
   g4: {angle: 0}
   g5: {angle: Q5}
   g6: {angle: Q6}
   g7: {angle: Q7}
   g8: {angle: Q8}

links:
   # particles
   p1: g1.upper
   p2: g2.lower
   p3: g3.upper

   # phase 1 - split
   g1.upper: g3.control
   g1.lower: g5.lower

   # phase 2a - couple from g1
   g3.control: g5.upper
   g3.upper: g4.upper
   g3.lower: g4.lower

   # phase 2b - couple from g2
   g2.upper: g4.control
   g4.control: g6.upper
   g2.lower: g6.lower

   #phase 3 - observe
   # (no g5/g6 control links: nothing ever arrives at those ports)
   g5.upper: g7.upper
   g5.lower: g7.lower
   g6.upper: g8.upper
   g6.lower: g8.lower