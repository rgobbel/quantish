title: Figure 4.13

caption: Here, one path diverts to prevent merging at *g2*.

variables:
   q15: 15°
   q60: 60°

run_stages:
   prepare: [g0]
   split: [g1]
   unsplit: [g2]
   test: [g3]

particles:
   p1: {sign: 1, weight: 1}

gates:
   g0: {angle: q15}
   g1: {angle: q60}
   g2: {angle: q60}
   g3: {angle: q15}

links:
   p1: g0.upper

   g0.control: g1.control
   g0.upper: g1.upper

   g1.control: g2.control
   g1.upper: g2.upper

   g2.control: g3.control
   g2.upper: g3.upper
   g2.lower: g3.lower

# the book labels only the prepare gate's inputs in this figure
wire_labels:
   '>g0.control': $w_1$
   p1: $w_2$
   '>g0.lower': $w_3$
