[project]
name = "quantish"
version = "0.1.0"
authors = [
  { name="Randy Gobbel", email="randy.gobbel@gmail.com" },
]
description = "Quantish physics: the Fredkin-gate quantum-like simulation from Good and Real, chapter 4"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.13"
dependencies = [
    "addict>=2.4.0",
    "altair>=6.2.2",
    "anywidget>=0.11.0",
    "marimo>=0.24.0",
    "networkx>=3.6.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pillow>=12.2.0",
    "pyarrow>=25",
    "python-mermaid>=0.1.6",
    "pyyaml>=6.0.3",
    "scipy>=1.18.0",
    "sympy>=1.14.0",
    "vl-convert-python>=1.9.0",
]

[project.scripts]
quantish = "quantish.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-subtests>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantish"]
