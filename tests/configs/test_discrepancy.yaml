title: Test Discrepancy
symbolic: false
merge:
   before_measure: false
   before_forwarding: false
   combine_signs: true
normalize_weights:
   output: false
   input: true
probability_threshold:
   control: 0
   forwarding: 0
   presence: 0
string_precision: 2
forward_all_weights: false
#alternative_measure: cpair3

loglevel: warning

variables:
   zero: &zero  "0j"
   one: &one  "1+0j"
   r60: &r60  "0.5+0.87j"
   q20: &q20 "rad(20)"
   q30: &q30 "rad(30)"
   q45: &q45 "rad(45)"
   q60: &q60 "rad(60)"
   q90: &q90 "rad(90)"
   q120: &q120 "rad(120)"
   q345: &q345 "acos(4/5)"
   qp4: &qp4 "pi/4"
   qp8: &qp8 "pi/8"
run_stages:
   stage1: [g1]
   stage2: [g2, g3]
particles:
   c:
      sign: 1
      weight: *zero
   p1:
      sign: 1
      weight: *one
   p2:
      sign: 1
      weight: *one
   p3:
      sign: 1
      weight: *one
gates:
#   g30:
#      angle: 0
#   g45:
#      angle: 'rad(30)'
#   g3:
#      angle: '0'
links:
#   c: g1.control
#   p1: g1.upper
#   p2: g2.upper
#   p3: g3.upper
#   g1.upper: g2.control
#   g1.lower: g3.control
