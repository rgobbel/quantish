title: Single Gate Test
symbolic: false
merge:
   before_measure: false
   before_forwarding: false
   combine_signs: true
normalize_weights:
   output: false
   input: false
probability_threshold:
   control: 0
   forwarding: 0
   presence: 0
string_precision: 2

sample: true
n_samples: 1

variables:
   zero: &zero  "0j"
   one: &one  "1+0j"
   minus_one: &minus_one  "-1+0j"
   r60: &r60  "0.5+0.866j"
   q0: &q0 0
   q30: &q30 "rad(30)"
   q45: &q45 "rad(45)"
   q60: &q60 "rad(60)"
   q90: &q90 "rad(90)"
   q120: &q120 "rad(120)"

phases:
   phase1: [g1]
particles:
   control0:
      weight: *zero
      sign: 1
   control1:
      weight: *one
      sign: 1
   p1:
      weight: *one
      sign: 1
gates:
   g1:
      angle: *q120
links:
#   control: g1.control
   p1: g1.upper
