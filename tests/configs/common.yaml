## options in this file will override those set in individual config files, if the --use-common
## option is set (defaults to True)

symbolic: false             # symbolic or numerical processing. Symbolic uses exact values when possible.

merge:                      # whether or not to merge measurement results before processing
   before_measure: false    # merge on the way in
   before_forwarding: false # merge on the way out
   combine_signs: true      # combine particles of opposite signs
   add_with_signs: false     # multiply by sign when adding particles
   combine_names: true

normalize_weights:          # whether or not to normalize weights so that their sum is one
   input: false             # normalize values of input particles before measurement
   output: false            # normalize values of output particles before returning from measurement

probability_threshold:      # threshold values determine whether or not particles are considered to exist
   control: 0               # controls whether or not a superposed control particle is "present"
   forwarding: 0            # particles whose probabilities are less than this are dropped
   presence: 0              # particles whose probabilities are less than this are not added to sinks
forward_all_weights: false

string_precision: 2         # float precision to use when printing weight values. Does not affect computation

sample: false

alternative_measure: false  # use an alternative method for cpair calculation

